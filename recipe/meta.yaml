{% set version = "0.72" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-ca
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/ca_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/ca/ca_{{ version }}.tar.gz
  sha256: 9c3b6abf177d557df8c18316194f95a1e5456259a6d95a460ea052125cd3b153

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('ca')"           # [not win]
    - "\"%R%\" -e \"library('ca')\""  # [win]

about:
  home: http://www.carme-n.org/
  license: GPL-2.0-or-later
  summary: Computation and visualization of simple, multiple and joint correspondence analysis.
  license_family: GPL
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r
